[package]
name = "lf"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
flate2 = "1"
gethostname = "0.5"
os_info = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
tar = "0.4"
ureq = "2"
whoami = "2.1.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
